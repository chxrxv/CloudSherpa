name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy core rag scripts evals

      - name: Unit tests (offline, no credentials)
        run: pytest -m "not integration"

      # Exercises the full eval path on 5 golden scenarios with a mocked model and judge and
      # a dependency-free hash embedder, so it needs no API key and no model downloads.
      # It checks plumbing, not quality: the report is marked MOCK RUN.
      - name: Smoke eval (mocked model)
        env:
          EMBEDDING_PROVIDER: hash
          RERANKER: none
        run: |
          python scripts/build_index.py
          python -m evals.run --tag ci-smoke --smoke --mock
          python -m evals.report ci-smoke >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-smoke-eval
          path: evals/runs/ci-smoke
