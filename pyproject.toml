[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsherpa"
version = "0.1.0"
description = "Multi-agent Google Cloud solution-architect assistant (ADK + Gemini + hybrid RAG)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8",
    "fastembed>=0.4",
    "google-genai>=1.0",
    "tzdata>=2024.1",  # zoneinfo data on Windows (Pacific-time daily quota reset)
]

[project.optional-dependencies]
# Optional managed backends (Vertex AI Vector Search, BigQuery, Cloud DLP).
gcp = [
    "google-cloud-aiplatform>=1.60",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["core*", "rag*", "agents*", "tools*", "mcp_server*", "api*", "evals*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs network, downloaded models or a Gemini key (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
