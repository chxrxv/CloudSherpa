# LLM price table (USD per 1M tokens), used for per-query cost estimates.
# Source: https://ai.google.dev/gemini-api/docs/pricing (Gemini Developer API, paid tier),
# retrieved 2026-10-13. Vertex AI list prices may differ; update this file if you run there.
# Output prices include thinking tokens. Prompts > `long_context_threshold` input tokens use
# the `long_*` rates when present. A model missing from this table is reported as "unpriced"
# and never guessed.
source: https://ai.google.dev/gemini-api/docs/pricing
retrieved: "2026-10-13"
models:
  gemini-3.8-flash:
    # Introductory price through 2026-12-31; $1.50 / $7.50 from 2027-01-01.
    - {effective_from: "2026-01-01", input: 0.75, output: 3.75}
    - {effective_from: "2027-01-01", input: 1.50, output: 7.50}
  gemini-3.1-pro-preview:
    - {effective_from: "2026-01-01", input: 2.00, output: 12.00,
       long_context_threshold: 200000, long_input: 4.00, long_output: 18.00}
